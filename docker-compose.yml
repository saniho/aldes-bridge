services:
  bridge:
    build: .
    image: aldes-bridge:latest
    container_name: aldes-bridge
    restart: unless-stopped
    # réseau host : la box Aldes se connecte en TLS au port 8883 de la machine
    network_mode: host
    volumes:
      # log MQTT persistant : survit aux rebuilds du conteneur
      - ./logs:/app/logs
    environment:
      - ALDES_MODE=bridge
      # rétention de l'historisation SQLite des valeurs (jours) ; la base vit dans logs/ (volume monté)
      - ALDES_HISTORY_DAYS=90
      # profil device (tone-aquaair par défaut)
      - ALDES_PROFILE=tone-aquaair
      # Home Assistant MQTT Auto-Discovery
      - HA_MQTT_ENABLED=true
      # IP du broker Mosquitto (add-on HA) depuis le host network
      - HA_MQTT_HOST=172.30.32.1
      - HA_MQTT_PORT=1883
      # Desactive le dry-run pour que les commandes HA soient envoyees a la box
      - HA_MQTT_DRY_RUN=false
    # app = python3 -m server.main [--mode ${ALDES_MODE} --mqtt-port 8883 --web-port 8080 --real-host aldesiotsuite.azure-devices.net]
    # Le mode changé depuis la WebUI est persisté dans logs/mode.json (volume monté) et
    # rejoué au redémarrage du conteneur, en priorité sur ALDES_MODE.