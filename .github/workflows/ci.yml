name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances (bridge python)
        run: pip install --quiet -r requirements.txt

      - name: Installer les dépendances (web)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Mettre à jour apt (runner Azure)
        run: |
          sudo apt-get update -o Acquire::http::No-Cache=true --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 fonts-liberation xdg-utils

      - name: Installer Chromium
        run: npx playwright install chromium
        working-directory: web

      - name: Lancer les tests E2E (Playwright BDD)
        run: npm run test:e2e
        working-directory: web

      - name: Upload du rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet pytest pytest-cov coverage-badge

      - name: Lancer les tests avec couverture
        run: |
          python3 -m pytest --cov=server --cov-report=term-missing \
            --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Rapport de couverture (XML + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      - name: Générer le badge de couverture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 -m coverage_badge -f -o docs/coverage.svg

      - name: Committer le badge mis à jour
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: maj badge de couverture [skip ci]'
          file_pattern: docs/coverage.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
